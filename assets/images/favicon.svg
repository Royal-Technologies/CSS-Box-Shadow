<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner highlight -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="15.5" fill="none" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1"/>

  <!-- Background Shadow Layer -->
  <rect x="18" y="18" width="22" height="22" rx="6" fill="none" stroke="rgba(255, 255, 255, 0.45)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Foreground Main Shadow Layer with Crisp Drop Shadow -->
  <rect x="24" y="24" width="22" height="22" rx="6" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
